spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/librarydb}
    username: ${DATABASE_USERNAME:library}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  seed:
    enabled: false

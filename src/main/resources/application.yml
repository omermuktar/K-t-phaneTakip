spring:
  application:
    name: library-management-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

info:
  app:
    name: Kütüphane Yönetim API'si
    version: 1.0.0
    description: Kitap, üye ve ödünç işlemlerini yöneten Spring Boot REST API
